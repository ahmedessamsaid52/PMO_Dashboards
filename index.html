<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDH PMO Dashboards</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --red:#C8102E;
    --dark:#14151A;
    --cream:#F7F5F0;
    --card:#FFFFFF;
    --border:#E3E1DC;
    --muted:#6B6F78;
    --green:#2E7D32;
    --green-bg:#EAF7EC;
    --green-border:#BFE3C6;
    --amber:#B45309;
    --amber-bg:#FEF3C7;
    --amber-border:#FCD34D;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 24px rgba(0,0,0,.10);
  }
  html,body{height:100%}
  body{
    font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--dark);
    -webkit-font-smoothing:antialiased;
  }

  #landing{min-height:100vh;padding:0 0 60px}
  .hub-topbar{
    background:var(--dark);
    border-bottom:3px solid var(--red);
    padding:18px 28px;
    display:flex;align-items:center;gap:14px;
  }
  .hub-idh-box{
    width:38px;height:38px;border-radius:8px;background:var(--red);
    display:flex;align-items:center;justify-content:center;
    font:800 14px/1 'Geist',sans-serif;color:#fff;letter-spacing:.02em;
    flex-shrink:0;
  }
  .hub-title{display:flex;flex-direction:column;gap:2px}
  .hub-title h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.01em}
  .hub-title span{font-size:11px;color:rgba(255,255,255,.5);font-weight:500;letter-spacing:.04em;text-transform:uppercase}

  .hub-body{max-width:1200px;margin:0 auto;padding:40px 28px}
  .hub-eyebrow{
    font:600 10.5px/1 'JetBrains Mono',monospace;color:var(--red);
    text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .hub-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red)}
  .hub-h2{font-size:26px;font-weight:800;color:var(--dark);margin-bottom:8px}
  .hub-sub{font-size:13px;color:var(--muted);margin-bottom:32px;max-width:640px;line-height:1.55}

  .project-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
  }
  .project-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:20px 20px 18px;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease;
    display:flex;flex-direction:column;gap:14px;
    text-align:left;
    font-family:inherit;
  }
  .project-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .project-card:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card-name{font-size:14.5px;font-weight:700;color:var(--dark);line-height:1.3}
  .card-sub{font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--muted);margin-top:5px}
  .card-arrow{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    background:var(--cream);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--dark);font-size:13px;transition:background .15s,color .15s,border-color .15s;
  }
  .project-card:hover .card-arrow{background:var(--red);border-color:var(--red);color:#fff}
  .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--border)}
  .card-ev{display:flex;flex-direction:column;gap:2px}
  .card-ev-val{font:800 18px/1 'JetBrains Mono',monospace;color:var(--dark)}
  .card-ev-lbl{font:500 9.5px/1 'Sora',sans-serif;color:var(--muted);margin-top:3px}
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    font:700 10px/1 'JetBrains Mono',monospace;
    padding:5px 10px;border-radius:20px;border:1px solid;white-space:nowrap;
  }
  .status-pill .variance{font-weight:800}
  .status-pill .sep{opacity:.45;font-weight:500}
  .status-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .status-red{background:rgba(200,16,46,0.08);color:var(--red);border-color:rgba(200,16,46,0.25)}
  .status-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
  .status-hold{background:#EEF0F2;color:var(--muted);border-color:var(--border)}
  .project-card.card-hold{background:#FAFAF8;opacity:.72}
  .project-card.card-hold:hover{transform:none;box-shadow:var(--shadow)}
  .project-card.card-hold .card-name{color:var(--muted)}
  .hold-banner{
    display:flex;align-items:center;gap:6px;
    font:700 9.5px/1 'JetBrains Mono',monospace;color:var(--muted);
    letter-spacing:.04em;text-transform:uppercase;
    background:#EEF0F2;border:1px dashed var(--border);border-radius:6px;
    padding:5px 8px;margin:-2px 0 -4px;
  }

  .hub-footer{max-width:1200px;margin:36px auto 0;padding:0 28px;font:500 10px/1 'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  #viewer{display:none;position:fixed;inset:0;background:var(--cream);z-index:500;flex-direction:column}
  #viewer.active{display:flex}
  .viewer-bar{
    background:var(--dark);border-bottom:3px solid var(--red);
    padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    color:#fff;font:600 11.5px/1 'Geist',sans-serif;
    padding:8px 14px;border-radius:8px;cursor:pointer;
    transition:background .15s;
  }
  .back-btn:hover{background:rgba(255,255,255,.16)}
  .viewer-name{font:700 13px/1 'Geist',sans-serif;color:#fff}
  #dashFrame{flex:1;width:100%;border:0;background:#fff}

  @media(max-width:640px){
    .hub-body{padding:28px 18px}
    .hub-h2{font-size:21px}
    .project-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="landing">
  <div class="hub-topbar">
    <div class="hub-idh-box">IDH</div>
    <div class="hub-title">
      <h1>PMO Dashboard Portfolio</h1>
      <span>Project Management Office</span>
    </div>
  </div>
  <div class="hub-body">
    <div class="hub-eyebrow">Live Project Status</div>
    <div class="hub-h2">Select a project</div>
    <div class="hub-sub">Click a project card to open its full dashboard — activity tracker, deliverable progress, S-curve, and Gantt chart.</div>
    <div class="project-grid" id="projectGrid"></div>
  </div>
  <div class="hub-footer">IDH Corp · PMO Dashboard Hub · Generated 12 Oct 2026</div>
</div>

<div id="viewer">

    <button class="back-btn" onclick="closeDashboard()">

      All Projects
    </button>
    <span class="viewer-name" id="viewerName"></span>
  </div>
  <iframe id="dashFrame" title="Project dashboard"></iframe>
</div>

function renderGrid(){
  const grid = document.getElementById('projectGrid');
  grid.innerHTML = '';
  PROJECTS.forEach(p=>{
    const card = document.createElement('button');
    card.className = 'project-card' + (p.onHold ? ' card-hold' : '');
    card.setAttribute('type','button');
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-sub">${p.sub}</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </div>
      ${p.onHold ? `<div class="hold-banner">&#9208; Project On Hold</div>` : ''}
      <div class="card-bottom">
        <div class="card-ev">
          <span class="card-ev-val">${p.ev}</span>
          <span class="card-ev-lbl">${p.plan}</span>
        </div>
        <span class="status-pill status-${p.statusClass}"><span class="variance">${p.variance}</span><span class="sep">&middot;</span>${p.status}</span>
      </div>`;
    card.addEventListener('click', ()=>openDashboard(p));
    grid.appendChild(card);
  });
}

function openDashboard(p){
  const frame = document.getElementById('dashFrame');
  frame.src = 'data:text/html;charset=utf-8;base64,' + B64[p.key];
  document.getElementById('viewerName').textContent = p.name;
  document.getElementById('viewer').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDashboard(){
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('dashFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

renderGrid();
</script>
